[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
description = "Python library for simulation of borehole heat exchanger systems"
authors = [
    {name = "Alessio Tollin"},
    {name = "Angelo Zarrella"},
]
requires-python = ">=3.11"

license = {text = "MIT"}
name = "pyCaRM"
version = "0.1.0"
dependencies = [
    "numpy",       # array
    "scipy",       # scientific functions
    "matplotlib",  # data plot
    "shapely",     # field geometry
    "networkx",    # borehole neighbor graph
]

[project.optional-dependencies]
dev = [
    "pygfunction",
    "pytest",
    "pandas",      # only needed by examples/Excel_input.py and the test suite
    "openpyxl",    # excel engine for the pandas round-trip in that example
]

docs = [
    "sphinx",
    "sphinxawesome-theme",
]

coolprop = [
    "CoolProp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["carm*"]